services:
  - type: web
    name: ehab700-host
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 4 --timeout 120 app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENABLE_KEEP_ALIVE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
